<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal - Sistem Manajemen Talenta</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light">

    <div id="auth-page" class="container-fluid d-none">
        <div class="auth-container mt-5">
            <div class="auth-visual">
                <h2 class="fw-bold mb-4">Sistem Lomba Kabupaten</h2>
                <p class="opacity-75">Kelola data peserta, penilaian juri, dan sertifikat dalam satu platform terintegrasi.</p>
                <div class="mt-4">
                    <div class="d-flex align-items-center mb-3"><i class="bi bi-check-circle-fill me-2"></i><span>Akses Terenkripsi</span></div>
                    <div class="d-flex align-items-center mb-3"><i class="bi bi-check-circle-fill me-2"></i><span>Monitoring Real-time</span></div>
                </div>
            </div>
            <div class="auth-form">
                <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item flex-fill"><button class="nav-link active w-100" data-bs-target="#tab-login" data-bs-toggle="pill" type="button">Login</button></li>
                    <li class="nav-item flex-fill"><button class="nav-link w-100" data-bs-target="#tab-aktivasi" data-bs-toggle="pill" type="button">Aktivasi</button></li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="tab-login">
                        <h4 class="fw-bold mb-1">Selamat Datang</h4>
                        <p class="text-muted mb-4 small">Silakan masuk dengan akun Anda.</p>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <input class="form-control" id="l_user" placeholder="admin / sekolah_id" type="text">
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <input class="form-control" id="l_pass" placeholder="••••••••" type="password">
                                <span class="input-group-text" onclick="togglePass('l_pass', this)"><i class="bi bi-eye"></i></span>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-auth w-100 text-white" onclick="Auth.login()">MASUK PORTAL</button>
                    </div>
                    <div class="tab-pane fade" id="tab-aktivasi">
                        <h4 class="fw-bold mb-1">Aktivasi Akun</h4>
                        <div class="mb-3 mt-3">
                            <input class="form-control" id="a_code" placeholder="Kode Aktivasi" type="text">
                        </div>
                        <div class="mb-3">
                            <input class="form-control" id="a_user" placeholder="Username Baru" type="text">
                        </div>
                        <div class="mb-4">
                            <input class="form-control" id="a_pass" placeholder="Password Baru" type="password">
                        </div>
                        <button class="btn btn-success btn-auth w-100 text-white border-0" onclick="Auth.aktivasi()" style="background: #10b981;">AKTIFKAN SEKARANG</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="admin-page" class="d-none">
        <header class="header bg-white shadow-sm d-flex justify-content-between align-items-center px-4 py-2 fixed-top">
            <div class="header-left d-flex align-items-center">
                <button class="menu-toggle btn border-0 me-3" onclick="UI.toggleSidebar()">
                    <i class="bi bi-list fs-3"></i>
                </button>
                <div>
                    <h5 class="mb-0 fw-bold" id="welcomeText">Dashboard</h5>
                    <small id="schoolInfo" class="text-primary font-mono"></small>
                </div>
            </div>
            <div class="user-menu position-relative">
                <div class="user-icon bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" 
                     style="width:40px; height:40px; cursor:pointer;" onclick="UI.toggleDropdown()">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="dropdown-menu shadow border-0 p-2 position-absolute end-0 mt-2" id="userDropdown">
                    <button class="dropdown-item rounded" onclick="App.ubahPassword()"><i class="bi bi-key me-2"></i> Ubah Password</button>
                    <hr class="dropdown-divider">
                    <button class="dropdown-item text-danger rounded" onclick="Auth.logout()"><i class="bi bi-box-arrow-right me-2"></i> Logout</button>
                </div>
            </div>
        </header>

        <div class="main-wrapper d-flex" style="margin-top: 70px;">
            <nav class="sidebar bg-white border-end shadow-sm" id="sidebar">
                </nav>

            <main class="content flex-grow-1 p-4" id="contentArea">
                <div class="d-flex justify-content-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </main>
        </div>

        <footer class="footer bg-white border-top py-3 text-center text-muted small mt-auto">
            &copy; 2026 Manajemen Talenta by Nurdin dan Gemini
        </footer>
    </div>

    <div class="modal fade" id="mainModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="modalTitle">Modal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent"></div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Batal</button>
                    <button type="button" class="btn btn-primary px-4" id="modalSubmitBtn">Simpan</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Inisialisasi SPA saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            UI.init();
        });

        // Toggle Password Helper
        function togglePass(id, el) {
            const input = document.getElementById(id);
            const icon = el.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        }
    </script>
</body>
</html>
